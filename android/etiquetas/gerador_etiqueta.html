<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Etiquetas BalançaGFIG</title>

    <!--
        Biblioteca para geração dos QR Codes.

        Se quiser que o gerador funcione completamente OFFLINE,
        baixe este arquivo e troque por algo como:

        <script src="qrcode.min.js"></script>
    -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <style>

        /*
         * Folha impressa em A4. As etiquetas de 100x100mm
         * são organizadas em grade (2 colunas x 2 linhas)
         * dentro de cada página, com linhas de corte entre
         * elas — isso evita depender do navegador/driver de
         * impressão suportar @page size customizado, que na
         * prática é ignorado por muitas impressoras e cai
         * sempre em A4 mesmo assim.
         */
        @page {
            size: A4;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ddd;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /*
         * Página A4 com grade 2x2 de etiquetas.
         */
        .folha {
            width: 210mm;
            height: 297mm;

            display: grid;
            grid-template-columns: 100mm 100mm;
            grid-template-rows: 100mm 100mm;

            justify-content: center;
            align-content: center;
            gap: 0;

            position: relative;

            break-after: page;
            page-break-after: always;
        }

        /*
         * Linhas de corte no meio da grade 2x2 de etiquetas
         * (bloco de 200mm x 200mm, centralizado na folha A4
         * de 210mm x 297mm — ou seja, a 5mm da esquerda/direita
         * e a 48.5mm do topo/base).
         */
        .folha::before,
        .folha::after {
            content: "";

            position: absolute;
        }

        /* linha vertical central, entre as duas colunas */
        .folha::before {
            top: 48.5mm;
            bottom: 48.5mm;
            left: 50%;

            width: 0;

            border-left: 0.2mm dashed #999;
        }

        /* linha horizontal central, entre as duas linhas */
        .folha::after {
            left: 5mm;
            right: 5mm;
            top: 50%;

            height: 0;

            border-top: 0.2mm dashed #999;
        }

        /*
         * Etiqueta física.
         */
        .etiqueta {
            width: 100mm;
            height: 100mm;

            background: white;
            /*
             * Texto escuro, e não cinza: a etiqueta é lida de perto e com
             * pressa, na bancada. O cinza fica só onde é estrutura (réguas e
             * molduras), nunca na fonte.
             */
            color: #111;

            padding: 3mm 4mm;

            position: relative;

            overflow: hidden;

            border: 0.2mm dashed #ccc;

            display: flex;
            flex-direction: column;
        }

        /*
         * Identificação: nome da aplicação e dados do aparelho num bloco só
         *
         * Antes eram dois — o cabeçalho com título, subtítulo e modelo, e logo
         * abaixo a barra azul com serial e MAC —, com uma régua e margens entre
         * eles. Juntar devolveu cerca de 6mm à etiqueta, que é justamente onde
         * as instruções e os QR codes estavam apertados.
         */
        .identificacao {
            background: #0d4162;
            color: white;

            border-radius: 1.5mm;

            padding: 1.4mm 2.5mm;

            margin-bottom: 1.8mm;
        }

        .identificacao-topo {
            display: flex;
            justify-content: space-between;
            align-items: baseline;

            gap: 2mm;
        }

        .titulo {
            font-size: 4mm;
            font-weight: bold;
            line-height: 1.1;
        }

        .subtitulo {
            font-size: 1.6mm;
            letter-spacing: 0.2mm;

            margin-left: 1.8mm;

            opacity: 0.75;
        }

        /*
         * Modelo do box, à direita do nome.
         *
         * Já foi também a versão do app ("App 2.7.4"), que saiu: é um adesivo
         * colado no aparelho e a versão muda sozinha pelo atualizador, então a
         * etiqueta envelhecia sem ninguém tocar nela. O que fica impresso é o
         * que não muda — modelo, serial, MAC, SSID.
         */
        .modelo {
            font-size: 3mm;
            font-weight: bold;
            line-height: 1.1;

            white-space: nowrap;
        }

        .identificacao-dados {
            display: flex;
            justify-content: space-between;
            align-items: baseline;

            gap: 2mm;

            margin-top: 0.9mm;
        }

        .serial {
            font-size: 2.8mm;
            font-weight: bold;

            word-break: break-all;
        }

        .mac {
            font-size: 2mm;
            opacity: 0.8;

            white-space: nowrap;
            text-align: right;
        }

        /*
         * Corpo principal
         */
        .conteudo {
            display: grid;

            grid-template-columns:
                1fr 30mm;

            gap: 3mm;

            flex: 1;

            min-height: 0;
        }

        /*
         * Instruções
         */
        .passos {
            font-size: 2.6mm;
            line-height: 1.22;

            overflow: hidden;
        }

        .passo {
            margin-bottom: 1.3mm;
        }

        .numero {
            display: inline-flex;

            width: 5mm;
            height: 5mm;

            align-items: center;
            justify-content: center;

            background: #0d4162;
            color: white;

            border-radius: 50%;

            font-weight: bold;

            margin-right: 1mm;
        }

        .destaque {
            font-weight: bold;
            color: #0d4162;
        }

        /*
         * Coluna dos QR Codes
         */
        .qrs {
            display: flex;
            flex-direction: column;

            align-items: center;
        }

        .qr-bloco {
            width: 100%;

            text-align: center;

            margin-bottom: 1.2mm;
        }

        .qr-titulo {
            font-size: 2.2mm;
            font-weight: bold;

            margin-bottom: 0.5mm;
        }

        .qr {
            display: inline-block;

            background: white;

            padding: 0.6mm;

            border: 0.3mm solid #aaa;
        }

        .qr canvas,
        .qr img {
            width: 18mm !important;
            height: 18mm !important;
        }

        /*
         * QR do manual: um pouco menor que os dois de cima, e não muito.
         *
         * Nasceu com 10mm, espremido numa etiqueta que não tinha mais altura.
         * Com o nome da aplicação e a identificação fundidos num bloco só,
         * sobrou espaço e ele cresceu. Continua menor que os outros dois porque
         * é o menos urgente dos três — quem está de pé na bancada, com o
         * celular na mão, quer o Wi-Fi.
         *
         * Sai com correção média (ver criarQRCode): menos módulos, cada um
         * maior. A 16mm o módulo fica em ~0,55mm, mais folgado que o dos dois
         * grandes, que usam correção alta.
         */
        .qr.manual canvas,
        .qr.manual img {
            width: 16mm !important;
            height: 16mm !important;
        }

        /*
         * As legendas dos QR grandes saíram para o do manual crescer.
         *
         * A rede e o endereço do painel já estão escritos por extenso nos
         * passos 4 e 5, logo ao lado — repetir embaixo do QR era gastar duas
         * linhas para dizer o que a instrução já diz. A senha ficou: é o único
         * lugar da etiqueta onde ela aparece.
         */

        .qr-texto {
            font-size: 1.9mm;
            line-height: 1.15;

            margin-top: 0.6mm;

            word-break: break-all;
        }

        /*
         * Bloco importante
         */
        .antes-ensaio {
            margin-top: 1mm;

            border: 0.5mm solid #e77d00;

            background: #fff4e8;

            border-radius: 1.5mm;

            padding: 1.2mm 1.8mm;
        }

        /*
         * Laranja escurecido em relação ao #c45700 de antes: a cor é a mesma
         * família, mas o título é a primeira coisa que se lê no bloco, e o
         * tom claro sobre o fundo creme pedia esforço de perto.
         */
        .antes-titulo {
            color: #8f3f00;

            font-weight: bold;

            font-size: 2.4mm;
        }

        .antes-texto {
            margin-top: 0.6mm;

            font-size: 2.4mm;

            font-weight: bold;
        }

        /*
         * Rodapé
         */
        .rodape {
            flex-shrink: 0;

            border-top: 0.3mm solid #aaa;

            margin-top: 1mm;
            padding-top: 1mm;

            /*
             * Maior que o resto do miúdo da etiqueta: é o rodapé que carrega o
             * link do manual, e quem precisa dele está de pé, com a TV ligada,
             * digitando no celular.
             */
            font-size: 2.4mm;
            line-height: 1.3;

            display: flex;
            justify-content: space-between;
            align-items: baseline;

            gap: 2mm;
        }

        .rodape-manual {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /*
         * Área de controles visível apenas na tela
         */
        #controles {
            position: sticky;
            top: 0;

            z-index: 999;

            background: #222;
            color: white;

            padding: 12px;

            text-align: center;
        }

        button {
            padding: 10px 20px;

            font-size: 16px;

            cursor: pointer;
        }

        /*
         * Na impressão:
         * - esconder botão
         * - retirar fundo cinza
         */
        @media print {

            body {
                background: white;
            }

            #controles {
                display: none;
            }

            .folha {
                margin: 0;
            }

            /*
             * Na impressão as linhas de corte ficam bem
             * discretas — o objetivo é guiar a tesoura/estilete,
             * não aparecer como moldura na etiqueta final.
             */
            .etiqueta {
                border-color: #ddd;
            }
        }

        /*
         * Apenas para visualização na tela.
         */
        @media screen {

            .folha {
                margin:
                    15px
                    auto;

                box-shadow:
                    0 0 10px
                    #555;
            }

        }

    </style>
</head>

<body>

<div id="controles">
    <button onclick="window.print()">
        Imprimir etiquetas
    </button>
</div>

<div id="etiquetas"></div>


<script>

/*
 * ============================================================
 * CONFIGURAÇÃO
 * ============================================================
 *
 * Para adicionar outro box,
 * basta adicionar outro objeto neste array.
 */

const boxes = [

    {
        modelo:
            "TX9",

        serial:
            "GFIG-TX9-58EB81E3618A",

        mac:
            "58:EB:81:E3:61:8A",

        ssid:
            "balancaGFIG-618A"
    },

    {
        modelo:
            "TX9",

        serial:
            "GFIG-TX9-58EB81E3618C",

        mac:
            "58:EB:81:E3:61:8C",

        ssid:
            "balancaGFIG-618C"
    },

    {
        modelo:
            "MXQ",

        serial:
            "GFIG-MXQ-A82003AC10E7",

        mac:
            "A8:20:03:AC:10:E7",

        ssid:
            "balancaGFIG-10E7"
    },

    {
        modelo:
            "MXQ",

        serial:
            "GFIG-MXQ-A82003AC10D4",

        mac:
            "A8:20:03:AC:10:D4",

        ssid:
            "balancaGFIG-10D4"
    },

    {
        modelo:
            "TX9",

        serial:
            "GFIG-TX9-58EB81E36158",

        mac:
            "58:EB:81:E3:61:58",

        ssid:
            "balancaGFIG-6158"
    }

];


/*
 * Senha padrão do hotspot.
 */
const senhaWifi =
    "12345678";


/*
 * Endereço local do painel.
 */
const enderecoPainel =
    "http://192.168.43.1";


/*
 * Endereço do manual de uso.
 *
 * É o roteiro publicado pelo GitHub Pages, gerado a partir de
 * pacotes/aplicacao/public/manual/index.html. O endereço anterior
 * (github.com/rbeninca/balanca/manual) dava 404: aquele formato de
 * URL não serve página, e o Pages do projeto é outro host.
 */
const enderecoManual =
    "https://rbeninca.github.io/balanca/manual/";


/*
 * ============================================================
 * HTML DA ETIQUETA
 * ============================================================
 */

function criarEtiqueta(box, indice) {

    const container =
        document.createElement(
            "section"
        );

    container.className =
        "etiqueta";


    container.innerHTML = `

        <div class="identificacao">

            <div class="identificacao-topo">

                <div>

                    <span class="titulo">
                        BALANÇA GFIG
                    </span>

                    <span class="subtitulo">
                        BANCA DE TESTE ESTÁTICO
                    </span>

                </div>

                <div class="modelo">
                    ${box.modelo}
                </div>

            </div>

            <div class="identificacao-dados">

                <span class="serial">
                    ${box.serial}
                </span>

                <span class="mac">
                    MAC ethernet ${box.mac}
                </span>

            </div>

        </div>


        <div class="conteudo">

            <div class="passos">


                <div class="passo">

                    <span class="numero">
                        1
                    </span>

                    <span class="destaque">
                        Ligue a TVBox
                    </span>

                    e aguarde o painel iniciar.

                </div>


                <div class="passo">

                    <span class="numero">
                        2
                    </span>

                    <span class="destaque">
                        Rede
                    </span>

                    — funciona sem Internet. Se possível, conecte um
                    <strong>
                        cabo de rede
                    </strong>
                    para atualizar e navegar na internet pela rede hotspot.

                </div>


                <div class="passo">

                    <span class="numero">
                        3
                    </span>

                    Conecte o

                    <strong>
                        ESP8266 + HX711
                    </strong>

                    à porta USB da TVBox.

                </div>


                <div class="passo">

                    <span class="numero">
                        4
                    </span>

                    <span class="destaque">
                        Celular
                    </span>

                    — desligue os

                    <strong>
                        dados móveis / 4G / 5G
                    </strong>

                    e conecte-se à rede

                    <strong>
                        ${box.ssid}
                    </strong>.

                </div>


                <div class="passo">

                    <span class="numero">
                        5
                    </span>

                    <span class="destaque">
                        Abra o painel
                    </span>

                    no navegador:

                    <strong>
                        192.168.43.1
                    </strong>

                    ou use o QR Code.

                </div>


                <div class="antes-ensaio">

                    <div class="antes-titulo">

                        6 — ANTES DO ENSAIO

                    </div>

                    <div class="antes-texto">

                        CALIBRAR
                        →
                        TARAR
                        →
                        INICIAR

                    </div>

                </div>


                <div class="passo">

                    <span class="numero">
                        7
                    </span>

                    <span class="destaque">
                        Após o ensaio
                    </span>

                    baixe os resultados. Backup local: insira um

                    <strong>
                        pendrive FAT32
                    </strong>.

                </div>


            </div>


            <div class="qrs">


                <div class="qr-bloco">

                    <div class="qr-titulo">
                        CONECTAR AO WI-FI
                    </div>

                    <div
                        class="qr"
                        id="qr-wifi-${indice}">
                    </div>

                    <div class="qr-texto">
                        Senha: ${senhaWifi}
                    </div>

                </div>


                <div class="qr-bloco">

                    <div class="qr-titulo">
                        ABRIR PAINEL
                    </div>

                    <div
                        class="qr"
                        id="qr-painel-${indice}">
                    </div>

                </div>


                <div class="qr-bloco">

                    <div class="qr-titulo">
                        MANUAL DE USO
                    </div>

                    <div
                        class="qr manual"
                        id="qr-manual-${indice}">
                    </div>

                </div>


            </div>

        </div>


        <div class="rodape">

            <span>
                IFSC • GFIG • UFPR
            </span>

            <span class="rodape-manual">
                Manual: ${enderecoManual}
            </span>

        </div>

    `;


    return container;
}


/*
 * ============================================================
 * QR CODE
 * ============================================================
 */

/*
 * O nível de correção de erro decide quantos módulos o QR carrega. H (alto)
 * aguenta até ~30% de dano e é o certo para os QR grandes; num QR pequeno,
 * porém, ele troca legibilidade por redundância que ninguém vai usar — são
 * módulos demais espremidos em poucos milímetros. O [correcao] permite baixar
 * para M (~15%) no QR do manual, que é o menor da etiqueta.
 */
function criarQRCode(
    elemento,
    texto,
    correcao
) {

    new QRCode(
        elemento,
        {
            text:
                texto,

            width:
                256,

            height:
                256,

            correctLevel:
                correcao === undefined
                    ? QRCode.CorrectLevel.H
                    : correcao
        }
    );

}


/*
 * Gera um QR no padrão de configuração Wi-Fi.
 *
 * Android e iPhone reconhecem este formato.
 *
 * Ao escanear, o celular oferece para conectar
 * diretamente à rede.
 */
function textoQRCodeWifi(
    ssid,
    senha
) {

    return (
        "WIFI:" +
        "T:WPA;" +
        "S:" + ssid + ";" +
        "P:" + senha + ";;"
    );

}


/*
 * ============================================================
 * GERAÇÃO DAS ETIQUETAS
 * ============================================================
 */

/*
 * Quantas etiquetas cabem por folha A4 (grade 2x2 de 100x100mm).
 */
const ETIQUETAS_POR_FOLHA = 4;


function gerarEtiquetas() {

    const destino =
        document.getElementById(
            "etiquetas"
        );


    let folhaAtual = null;


    boxes.forEach(
        (
            box,
            indice
        ) => {

            /*
             * A cada 4 etiquetas, abre uma nova folha A4.
             */
            if (indice % ETIQUETAS_POR_FOLHA === 0) {

                folhaAtual =
                    document.createElement(
                        "section"
                    );

                folhaAtual.className =
                    "folha";

                destino.appendChild(
                    folhaAtual
                );

            }


            /*
             * Cria o HTML.
             */
            const etiqueta =
                criarEtiqueta(
                    box,
                    indice
                );


            folhaAtual.appendChild(
                etiqueta
            );


            /*
             * QR Code da rede Wi-Fi.
             */
            criarQRCode(

                document.getElementById(
                    `qr-wifi-${indice}`
                ),

                textoQRCodeWifi(
                    box.ssid,
                    senhaWifi
                )

            );


            /*
             * QR Code da página da balança.
             */
            criarQRCode(

                document.getElementById(
                    `qr-painel-${indice}`
                ),

                enderecoPainel

            );


            /*
             * QR Code do manual de uso.
             *
             * Mesmo endereço que o rodapé imprime por extenso — o QR é para
             * quem está com o celular na mão, o texto é para quem prefere
             * digitar ou anotar.
             */
            criarQRCode(

                document.getElementById(
                    `qr-manual-${indice}`
                ),

                enderecoManual,

                QRCode.CorrectLevel.M

            );

        }
    );

}


/*
 * Executa quando a página carregar.
 */
window.addEventListener(
    "load",
    gerarEtiquetas
);

</script>

</body>
</html>
