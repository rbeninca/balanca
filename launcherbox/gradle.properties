org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Sem `org.gradle.java.home`: é caminho absoluto e quebraria no CI. Quem
# precisa de um JDK específico fixa em ~/.gradle/gradle.properties (da máquina,
# não versionado). Ver o comentário equivalente em android/gradle.properties.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
