name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Compilar firmware
        run: |
          pip install platformio
          platformio run --environment nodemcuv2
        working-directory: firmware

      - name: Copiar firmware para assets da aplicação
        run: |
          mkdir -p pacotes/aplicacao/public
          cp firmware/.pio/build/nodemcuv2/firmware.bin pacotes/aplicacao/public/firmware.bin
          cp firmware/versao.json pacotes/aplicacao/public/firmware-versao.json

      - name: Instalar dependências Node
        run: npm ci

      - name: Build da aplicação
        run: npm run compilar --workspace=pacotes/aplicacao
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pacotes/aplicacao/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
